services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: childcare
      POSTGRES_PASSWORD: childcare
      POSTGRES_DB: childcare
    ports: ["55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["56379:6379"]
volumes:
  postgres_data:
